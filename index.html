<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>සදහම් පිටකය | ත්‍රිපිටක සූත්‍ර දේශනා</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Sinhala:wght@400;700&family=Noto+Sans+Sinhala:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #2c1810; --gold: #c7a35a; --cream: #fdfaf5; --paper: #ffffff; --ink: #1a1a1a; }
        body { margin: 0; font-family: 'Noto Sans Sinhala', sans-serif; background: var(--cream); color: var(--ink); line-height: 1.8; }
        .hero { 
            height: 70vh; 
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('hero-bg.png') center top/cover no-repeat; 
            display: flex; align-items: center; justify-content: center; text-align: center; color: white; 
        }
        .hero-content h1 { font-family: 'Noto Serif Sinhala', serif; font-size: clamp(2.5rem, 6vw, 4rem); margin: 0; text-shadow: 2px 2px 15px rgba(0,0,0,0.7); }
        .container { max-width: 1200px; margin: -50px auto 50px; padding: 0 20px; display: grid; grid-template-columns: 300px 1fr; gap: 30px; }
        @media (max-width: 900px) { .container { grid-template-columns: 1fr; margin-top: 20px; } }
        .sidebar { background: var(--paper); border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); height: fit-content; overflow: hidden; border: 1px solid #e0dacc; }
        .sidebar-header { background: var(--primary); color: var(--gold); padding: 20px; font-weight: bold; }
        .nikaya-item summary { padding: 15px; cursor: pointer; font-weight: bold; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; }
        .sutta-link { display: block; padding: 10px 20px; color: #555; text-decoration: none; font-size: 0.9rem; border-bottom: 1px dashed #eee; }
        .sutta-link:hover { background: #fff9eb; color: var(--gold); }
        .reader { background: var(--paper); border-radius: 12px; padding: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border: 1px solid #e0dacc; min-height: 500px; }
        .sutta-title { font-family: 'Noto Serif Sinhala', serif; color: #855d29; border-bottom: 2px solid var(--gold); padding-bottom: 10px; }
        .sutta-content { font-size: 1.2rem; white-space: pre-line; text-align: justify; margin-top: 20px; }
        .loading { padding: 20px; text-align: center; color: #888; }
    </style>
</head>
<body>
    <section class="hero">
        <div class="hero-content">
            <h1>සදහම් පිටකය</h1>
            <p>ශ්‍රී සද්ධර්මය ලෝකවාසී සැමට හිතසුව පිණිස පවත්වමු.</p>
        </div>
    </section>

    <div class="container">
        <aside class="sidebar">
            <div class="sidebar-header">පටුන</div>
            <div id="menu-loading" class="loading">දත්ත පූරණය වෙමින්...</div>
            <div id="nikaya-menu"></div>
        </aside>

        <main class="reader" id="reader">
            <div id="content-area">
                <h2 style="color: var(--gold); text-align: center; margin-top: 100px;">සාදරයෙන් පිළිගනිමු</h2>
                <p style="text-align: center; color: #666;">කියවීම සඳහා වම් පස ඇති පටුනෙන් සූත්‍රයක් තෝරාගන්න.</p>
            </div>
        </main>
    </div>

    <script>
        async function init() {
            try {
                const res = await fetch('data/sutta-nikayas.json');
                const data = await res.json();
                const menu = document.getElementById('nikaya-menu');
                document.getElementById('menu-loading').style.display = 'none';

                data.nikayas.forEach(nikaya => {
                    const det = document.createElement('details');
                    det.className = 'nikaya-item';
                    det.innerHTML = `<summary>${nikaya.nameSi} ▾</summary><div id="list-${nikaya.id}" class="loading">සූත්‍ර ලැයිස්තුව පූරණය වෙමින්...</div>`;
                    det.addEventListener('toggle', () => loadSuttas(nikaya.id, nikaya.file), { once: true });
                    menu.appendChild(det);
                });
            } catch (e) { console.error("Error loading Nikayas"); }
        }

        async function loadSuttas(id, file) {
            try {
                const res = await fetch(`data/sutta/${file}`);
                const data = await res.json();
                const container = document.getElementById(`list-${id}`);
                container.innerHTML = '';
                data.suttas.forEach(s => {
                    const a = document.createElement('a');
                    a.className = 'sutta-link';
                    a.href = '#';
                    a.innerText = s.titleSi;
                    a.onclick = (e) => { e.preventDefault(); showSutta(s); };
                    container.appendChild(a);
                });
            } catch (e) { console.error("Error loading suttas"); }
        }

        function showSutta(s) {
            document.getElementById('content-area').innerHTML = `
                <h2 class="sutta-title">${s.titleSi}</h2>
                <p style="color: #888; font-style: italic;">${s.paliTitle || ''} | ${s.reference || ''}</p>
                <div class="sutta-content">${s.contentSi}</div>
            `;
            window.scrollTo({ top: document.getElementById('reader').offsetTop - 20, behavior: 'smooth' });
        }
        init();
    </script>
</body>
</html>
