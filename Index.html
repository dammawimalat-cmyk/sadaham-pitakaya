<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>සඳහම් පිටකය - ත්‍රිපิตක ධර්මය</title>
    <style>
        body {
            margin: 0; padding: 0; font-family: 'Iskoola Pota', sans-serif;
            background: linear-gradient(135deg, #001f3f 0%, #000a1a 100%);
            color: white; min-height: 100vh; display: flex;
            flex-direction: column; align-items: center; overflow-x: hidden;
        }
        .glow-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(255, 140, 0, 0.15) 0%, transparent 60%);
            animation: moveGlow 8s infinite alternate; z-index: -1;
        }
        @keyframes moveGlow {
            0% { transform: scale(1); opacity: 0.5; }
            100% { transform: scale(1.2); opacity: 1; }
        }
        header { text-align: center; padding: 60px 20px; }
        .dhamma-chakra {
            width: 120px; filter: drop-shadow(0 0 15px #ff8c00);
            animation: rotateChakra 25s linear infinite;
        }
        @keyframes rotateChakra { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        h1 { color: #ff8c00; font-size: 2.8rem; margin-top: 20px; text-shadow: 0 0 15px rgba(255,140,0,0.4); }
        .address { font-size: 1rem; opacity: 0.8; margin-bottom: 30px; line-height: 1.6; }
        .login-container {
            background: rgba(255, 255, 255, 0.07); padding: 40px;
            border-radius: 20px; border: 1px solid rgba(255, 140, 0, 0.3);
            backdrop-filter: blur(12px); width: 350px; text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        input[type="email"] {
            width: 90%; padding: 12px; margin: 20px 0; border-radius: 8px;
            border: 1px solid #ff8c00; background: rgba(0,0,0,0.3); color: white; outline: none;
        }
        .btn-login {
            background: #ff8c00; color: white; border: none; padding: 12px 30px;
            border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; width: 100%;
        }
        .btn-login:hover { background: #e67e00; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(255, 140, 0, 0.4); }
    </style>
</head>
<body>
    <div class="glow-bg"></div>
    <header>
        <img src="https://upload.wikimedia.org/wikipedia/commons/d/df/Dharma_Wheel.svg" alt="Dhamma Chakra" class="dhamma-chakra">
        <h1>සඳහම් පිටකය</h1>
        <p class="address">බෞද්ධායතන ග්‍රන්ථ මණ්ඩලය,<br>වටරප්පල පාර, ගල්කිස්ස.</p>
    </header>
    <div class="login-container">
        <h3>ධර්මය හැදෑරීමට</h3>
        <p>ඔබගේ ඊමේල් ලිපිනයෙන් නොමිලේ ඇතුළු වන්න</p>
        <input type="email" placeholder="ඔබේ Email ලිපිනය">
        <button class="btn-login">ඇතුළු වන්න</button>
    </div>
</body>
</html>
